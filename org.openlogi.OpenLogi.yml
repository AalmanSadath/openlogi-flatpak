# Flatpak manifest for OpenLogi, built from an upstream release tarball.
#
# OpenLogi's own repository publishes .deb/.rpm/.pkg.tar.zst packages with no
# repository behind them, and its in-app updater ships no Linux artifact: its
# release manifest classifies only .dmg/.msi/.zip. So every Linux upgrade is a
# manual download. A Flatpak remote is the missing piece: install once, then
# `flatpak update` (or GNOME Software / KDE Discover in the background) keeps it
# current.
#
# Nothing here is patched. The tarball is exactly what upstream released, so
# this packaging carries no drift and needs no changes upstream. Only the build
# environment lives here, because that is genuinely packaging's problem:
#
#   - rustup rather than the SDK's rust extension. The workspace sets
#     `rust-version` to whatever stable is current, and
#     org.freedesktop.Sdk.Extension.rust-stable trails it by weeks (1.97.1 when
#     the workspace asked for 1.98), which cargo refuses outright. rustup
#     installs what rust-toolchain.toml names, so the build tracks the project
#     instead of the SDK's release cadence.
#   - llvm20, because openlogi-camera pulls v4l2-sys-mit, whose build script
#     runs bindgen and dlopens libclang. The base SDK ships none.
#
# Local build:
#   flatpak-builder --user --install --force-clean build org.openlogi.OpenLogi.yml
id: org.openlogi.OpenLogi
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: openlogi-desktop

finish-args:
  # ── display ────────────────────────────────────────────────────────────────
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # GPUI renders through wgpu/Vulkan.
  - --device=dri

  # ── device access ──────────────────────────────────────────────────────────
  # /dev/hidraw* for HID++ I/O, /dev/input/event* for the evdev read side of the
  # hook, /dev/uinput for the synthetic-event write side. `--device=all` is the
  # only permission covering hidraw and uinput; `--device=input` leaves both out.
  #
  # This grants the sandbox a path to those nodes, not DAC permission: the host
  # still needs 70-openlogi.rules installed, exactly as a distro package would.
  # The rules ship inside the app at /app/share/openlogi/udev/ for that purpose.
  - --device=all

  # ── network ────────────────────────────────────────────────────────────────
  # Device render images are fetched from OpenLogi's asset mirrors and cached in
  # the app's data dir. No account, no telemetry.
  - --share=network

  # ── D-Bus ──────────────────────────────────────────────────────────────────
  # Media-key actions drive whatever player is on the bus, over MPRIS.
  - --talk-name=org.mpris.MediaPlayer2.*

modules:
  - name: openlogi
    buildsystem: simple
    build-options:
      append-path: /run/build/openlogi/cargo/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      build-args:
        # Cargo resolves crates.io and the workspace's git dependencies during
        # the build. Fine for a self-hosted repository; a Flathub submission
        # would need these vendored instead.
        - --share=network
      env:
        CARGO_HOME: /run/build/openlogi/cargo
        RUSTUP_HOME: /run/build/openlogi/rustup
        # Where bindgen looks for libclang (v4l2-sys-mit's build script).
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        # The GPUI crates are the long pole; debug info is dead weight here.
        CARGO_PROFILE_RELEASE_DEBUG: 'false'
    build-commands:
      # No version is pinned here on purpose: rust-toolchain.toml is the source
      # of truth, and rustup installs exactly what it names.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
          | sh -s -- -y --profile minimal --no-modify-path

      - cargo build --release --locked
          -p openlogi -p openlogi-desktop -p openlogi-overlay -p openlogi-agent

      # ── binaries ─────────────────────────────────────────────────────────
      # All four. The GUI owns no device I/O (it is a pure IPC client) and it
      # launches the agent from beside its own executable, so a bundle missing
      # the agent starts, renders, and lists nothing.
      - install -Dm755 target/release/openlogi         /app/bin/openlogi
      - install -Dm755 target/release/openlogi-desktop /app/bin/openlogi-desktop
      - install -Dm755 target/release/openlogi-overlay /app/bin/openlogi-overlay
      - install -Dm755 target/release/openlogi-agent   /app/bin/openlogi-agent

      # ── XDG integration ──────────────────────────────────────────────────
      # The .desktop and AppStream files are packaging's own: upstream ships a
      # .desktop named for a system install, and no AppStream metadata at all.
      - install -Dm644 org.openlogi.OpenLogi.desktop
          /app/share/applications/org.openlogi.OpenLogi.desktop
      - install -Dm644 org.openlogi.OpenLogi.metainfo.xml
          /app/share/metainfo/org.openlogi.OpenLogi.metainfo.xml

      # design/icon/openlogi.png is 1024x1024, which `flatpak build-export`
      # rejects outright ("Image too large. Max. size 512x512"), so the source
      # icon is only ever installed rescaled. The SDK has no ImageMagick;
      # ffmpeg is present and scales PNG fine.
      - for px in 512 256 128 64; do
          install -d "/app/share/icons/hicolor/${px}x${px}/apps";
          ffmpeg -loglevel error -i design/icon/openlogi.png -vf "scale=${px}:${px}"
            "/app/share/icons/hicolor/${px}x${px}/apps/org.openlogi.OpenLogi.png";
        done

      # ── host-side udev rules ─────────────────────────────────────────────
      # A Flatpak cannot write /etc/udev/rules.d. Ship the rules so the user can
      # copy them out; see the README for the one-time command.
      - install -Dm644 packaging/linux/udev/70-openlogi.rules
          /app/share/openlogi/udev/70-openlogi.rules

      - install -Dm644 LICENSE-APACHE /app/share/licenses/openlogi/LICENSE-APACHE
      - install -Dm644 LICENSE-MIT    /app/share/licenses/openlogi/LICENSE-MIT
    sources:
      # Pinned so this manifest builds standalone. CI rewrites both fields for
      # whichever release it is publishing.
      - type: archive
        url: https://github.com/AprilNEA/OpenLogi/archive/refs/tags/v0.7.4.tar.gz
        sha256: 4c3a7586151f20d20e5c56a425df7c35c9c6b0cd2dfab9f26c6954e90615542e
        strip-components: 1
      - type: file
        path: org.openlogi.OpenLogi.desktop
      - type: file
        path: org.openlogi.OpenLogi.metainfo.xml
