# Build OpenLogi from an upstream release tarball and publish both
# architectures as a signed OSTree repository on Cloudflare R2.
#
# Upstream ships .deb/.rpm/.pkg.tar.zst with no repository behind them, and its
# in-app updater publishes no Linux artifact, so nothing on Linux can upgrade
# itself. This is that missing half, and it needs nothing from upstream: it
# consumes released tarballs, unmodified.
#
# Publishing is gated on FLATPAK_GPG_PRIVATE_KEY. Without it the build still
# runs and uploads artifacts, so a fork of this repo is inert rather than red.
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (blank = latest release)"
        type: string
        default: ""
  # Upstream releases are not events this repository can see, so poll. Daily is
  # far more often than OpenLogi releases, and a run where the published version
  # already matches upstream exits before building anything.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLATPAK_ID: org.openlogi.OpenLogi
  UPSTREAM: AprilNEA/OpenLogi
  RUNTIME_VERSION: "25.08"

jobs:
  # The build itself lives in build.yml, which is also dispatchable on its own
  # to produce nothing but the two `.flatpak` bundles. One definition, so a
  # release can never be built differently from what the repository serves.
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Publish to R2
    needs: build
    # The called workflow succeeds even when its build job skipped, so the
    # skip has to be read from the output rather than inferred from `needs`.
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Check for the signing key and the bucket credentials
        id: gate
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          missing=""
          [ -n "$KEY" ] || missing="${missing} FLATPAK_GPG_PRIVATE_KEY"
          [ -n "$R2_ACCOUNT_ID" ] || missing="${missing} R2_ACCOUNT_ID"
          [ -n "$R2_ACCESS_KEY_ID" ] || missing="${missing} R2_ACCESS_KEY_ID"
          [ -n "$R2_SECRET_ACCESS_KEY" ] || missing="${missing} R2_SECRET_ACCESS_KEY"
          [ -n "$R2_BUCKET" ] || missing="${missing} R2_BUCKET"
          [ -n "$R2_PUBLIC_BASE" ] || missing="${missing} R2_PUBLIC_BASE"
          if [ -n "$missing" ]; then
            echo "not configured, skipping publish:${missing}" >&2
            echo "A fork without these is inert rather than red: the build still" >&2
            echo "runs and uploads artifacts, it just publishes nowhere." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flatpak and rclone
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
          # A shell variable, deliberately not an environment one. rclone maps
          # every RCLONE_* variable in the environment onto the flag of the
          # same name, so RCLONE_VERSION is read as --version, which is a
          # boolean, and every rclone invocation in the job dies on
          # `strconv.ParseBool` before it does anything.
          version=v1.75.0
          # Pinned rather than apt's. The runner image moves under us, and an
          # rclone whose defaults changed is indistinguishable from a workflow
          # bug when the bucket starts rejecting uploads.
          curl -fsSL -o /tmp/rclone.zip \
            "https://downloads.rclone.org/${version}/rclone-${version}-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m755 "/tmp/rclone-${version}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.configured == 'true'
        with:
          pattern: flatpak-repo-*
          path: arch-repos

      - name: Import the signing key
        if: steps.gate.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print "GPG_FINGERPRINT=" $10; exit}' >> "$GITHUB_ENV"

      - name: Merge both architectures into one signed repository
        if: steps.gate.outputs.configured == 'true'
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          # Fail loudly. A failure inside `$( )` in a for-list does not trip
          # `set -e`, which is how an empty store once published green: the ref
          # loop silently iterated nothing. nullglob turns a non-matching glob
          # into no iterations rather than one iteration over the literal.
          set -euo pipefail
          shopt -s nullglob

          # actions/upload-artifact does not carry empty directories, and a
          # freshly built OSTree repo has several: refs/mirrors, refs/remotes,
          # state, tmp/cache, extensions. `ostree refs` opendir()s
          # refs/remotes and fails without it, so a repo that survived the
          # artifact round-trip is not usable until they are put back. The old
          # `pull --mirror` never noticed because it reads the source repo's
          # summary over a file:// remote rather than listing its refs.
          for repo in arch-repos/flatpak-repo-*; do
            mkdir -p "$repo"/refs/heads "$repo"/refs/mirrors \
              "$repo"/refs/remotes "$repo"/state "$repo"/tmp/cache \
              "$repo"/extensions
          done

          echo "::group::artifacts as downloaded"
          ls -la arch-repos || echo "arch-repos missing"
          for repo in arch-repos/*; do
            echo "--- $repo"
            ostree --repo="$repo" refs || echo "  not an ostree repo"
          done
          echo "::endgroup::"

          # Seeded from what is already published, then bounded by
          # --prune-depth below. Keeping parents buys two things a from-scratch
          # rebuild cannot: clients can roll back to a previous commit, and
          # static deltas have something to delta against instead of every
          # update being a full download.
          #
          # The seed is a full download of the retained store on every run.
          # That was the reason to keep the depth modest on GitHub Pages, where
          # it came out of a 100 GB/month allowance. R2 charges nothing for
          # egress, so the depth is now bounded by storage (~64 MB per release
          # across both arches) rather than by transfer.
          # ostree init does not create parents.
          mkdir -p site/repo
          ostree --repo=site/repo init --mode=archive-z2

          published_repo="${R2_PUBLIC_BASE%/}/repo/"
          if curl -fsSL -o /dev/null "${published_repo}config"; then
            echo "seeding from ${published_repo}"
            # --no-gpg-verify: these commits were signed by this workflow on the
            # way out and are re-signed below; verifying here would need the
            # public key imported purely to read our own history back.
            ostree --repo=site/repo remote add --no-gpg-verify \
              --if-not-exists published "${published_repo}"
            # How many refs the remote advertises, before pulling anything.
            remote_refs="$(ostree --repo=site/repo remote refs published | wc -l)"
            echo "published repository advertises ${remote_refs} ref(s)"
            # No `|| echo` here. Swallowing this is what left the store with no
            # parent to commit onto, so every build landed parentless and the
            # history this exists to keep never formed.
            #
            # --depth is not optional here. It defaults to 0, meaning "traverse
            # no parents": the seed takes each ref's head commit and nothing
            # behind it, so the store rebuilt every run held the previous
            # release plus the new one and never more, whatever --prune-depth
            # said. Kept in step with --prune-depth below: N parents plus the
            # head is N+1 commits, and the new commit on top is pruned back to
            # N+1 again.
            ostree --repo=site/repo pull --mirror --depth=8 published
            seeded="$(ostree --repo=site/repo refs | wc -l)"
            echo "seeded ${seeded} ref(s)"
            # Ref count alone cannot see the failure this guard was written
            # for: six refs seeded one commit deep looks identical to six
            # seeded nine deep, and the shallow one silently caps retention.
            seeded_refs="$(ostree --repo=site/repo refs)"
            while read -r ref; do
              [ -n "$ref" ] || continue
              echo "  seeded ${ref} at $(ostree --repo=site/repo log "$ref" | grep -c '^commit ') commit(s)"
            done <<< "$seeded_refs"
            if [ "$remote_refs" -gt 0 ] && [ "$seeded" -eq 0 ]; then
              echo "::error::the published repository advertises ${remote_refs} refs but none were seeded" >&2
              exit 1
            fi
          else
            echo "no published repository yet; starting a fresh store"
          fi
          # `ostree pull --mirror` would overwrite each ref with the build
          # job's commit, which has no parent - the seeded history would become
          # unreachable and be pruned, leaving --prune-depth nothing to keep.
          # build-commit-from instead lands the same content as a new commit on
          # top of whatever the ref already points at, which is what makes the
          # chain (and therefore rollback and deltas) exist at all.
          #
          # It also signs the commits it creates. flatpak-builder makes them in
          # the build jobs, which have no access to the key, and
          # `build-update-repo --gpg-sign` signs only the summary, while a
          # client verifies the commit it pulls. Without a signature here every
          # install fails with "GPG verification enabled, but no signatures
          # found".
          committed=0
          for repo in arch-repos/flatpak-repo-*; do
            refs="$(ostree --repo="$repo" refs)"
            if [ -z "$refs" ]; then
              echo "::error::$repo lists no refs" >&2
              exit 1
            fi
            while read -r ref; do
              [ -n "$ref" ] || continue
              echo "committing $ref from $(basename "$repo")"
              flatpak build-commit-from \
                --src-repo="$repo" --src-ref="$ref" \
                --gpg-sign="${GPG_FINGERPRINT}" --gpg-homedir="${GNUPGHOME}" \
                --no-update-summary \
                site/repo "$ref"
              committed=$((committed + 1))
              parent="$(ostree --repo=site/repo log "$ref" | grep -c '^commit ')"
              echo "  ${ref} now ${parent} commit(s) deep"
            done <<< "$refs"
          done
          if [ "$committed" -eq 0 ]; then
            echo "::error::no refs were committed; refusing to publish an empty repository" >&2
            exit 1
          fi
          echo "committed ${committed} ref(s)"

          # Deltas matter more on R2 than they did on Pages, and for a
          # different reason. Bytes are free here; requests are not. A full
          # pull of an archive-z2 store fetches every object as its own
          # request, a few thousand of them, while an update that can use a
          # delta fetches a handful. --prune-depth=8 keeps the current commit
          # plus eight, so a release that breaks something has several places
          # to roll back to. Depth buys rollback range rather than delta
          # coverage: deltas are generated between consecutive commits, so a
          # client skipping releases still falls back to a full download
          # however deep the store is.
          flatpak build-update-repo \
            --gpg-sign="${GPG_FINGERPRINT}" \
            --generate-static-deltas \
            --prune --prune-depth=8 \
            site/repo
          # A summary without the app refs is the failure that shipped before:
          # every step green, every client seeing an empty remote. Refuse to
          # hand that to the upload, which deletes whatever the local store
          # does not have.
          published_refs="$(ostree --repo=site/repo refs | grep -c "^app/" || true)"
          if [ "$published_refs" -eq 0 ]; then
            echo "::error::site/repo has no app refs after update; refusing to publish" >&2
            exit 1
          fi
          echo "app refs in the store: ${published_refs}"

          ostree --repo=site/repo refs
          # History depth per ref, so a run makes it obvious whether parents
          # are accumulating or every build is still landing parentless.
          refs_now="$(ostree --repo=site/repo refs)"
          while read -r ref; do
            [ -n "$ref" ] || continue
            echo "${ref}: $(ostree --repo=site/repo log "$ref" | grep -c '^commit ') commit(s) retained"
          done <<< "$refs_now"
          du -sh site/repo
          du -sh site/repo/deltas 2>/dev/null || echo "no deltas generated"
          echo "store: $(du -sm site/repo | cut -f1) MB"

          # The real completeness check, and the one worth having before the
          # upload is allowed to delete anything: fsck walks every object
          # reachable from every ref and fails on one that is missing or
          # corrupt. A store that passes this is publishable whatever its
          # object count happens to be.
          ostree --repo=site/repo fsck
          echo "objects: $(find site/repo/objects -type f | wc -l)"

      - name: Write the remote descriptors
        if: steps.gate.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE%/}"
          gpg --export "${GPG_FINGERPRINT}" > site/openlogi.gpg
          key_b64="$(base64 -w0 < site/openlogi.gpg)"

          # Read back by scheduled runs to skip rebuilding what is already out.
          # Uploaded last, after the store is live, so a run that dies midway
          # does not convince the next one there is nothing to do.
          printf '%s' "${VERSION}" > site/published-version

          cat > site/openlogi.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=OpenLogi
          Url=${base}/repo/
          Homepage=https://github.com/${UPSTREAM}
          Comment=Logitech HID++ device control
          Description=Remap buttons, DPI, and SmartShift on Logitech devices.
          GPGKey=${key_b64}
          EOF

          cat > "site/${FLATPAK_ID}.flatpakref" <<EOF
          [Flatpak Ref]
          Title=OpenLogi
          Name=${FLATPAK_ID}
          Branch=stable
          Url=${base}/repo/
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=${key_b64}
          EOF

          sed -e "s|@BASE@|${base}|g" -e "s|@VERSION@|${VERSION}|g" \
            index.html.in > site/index.html

      - name: Upload to R2
        if: steps.gate.outputs.configured == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          # R2 does not implement ACLs, and an unsupported x-amz-acl is
          # answered with `501 NotImplemented: Not Implemented` on every
          # upload. Cloudflare's own rclone configuration sets this
          # explicitly rather than leaving it to whatever the client defaults
          # to that week.
          RCLONE_CONFIG_R2_ACL: private
          BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail

          # The last phase deletes whatever the bucket has and the local store
          # does not, so a store that came out wrong would empty the remote
          # rather than fail. Completeness is already proven by `ostree fsck`
          # in the previous step; what is checked here is the one thing fsck
          # cannot see, which is how this store compares to the one it is
          # replacing.
          #
          # A fixed floor was the wrong instrument: OpenLogi installs about a
          # dozen files per arch, so a correct store is well under a hundred
          # objects and any threshold worth tripping over is a guess. Measuring
          # against the bucket needs no guess. Half is deliberately loose --
          # lowering --prune-depth legitimately shrinks the store -- while
          # still catching the case this exists for, a near-empty local store
          # about to delete a full remote one.
          objects="$(find site/repo/objects -type f | wc -l)"
          # `|| true` is not decoration: pipefail makes the whole substitution
          # fail when the prefix does not exist yet, which on a fresh bucket
          # would exit the step instead of reading zero.
          remote_objects="$(rclone lsf --files-only -R "r2:${BUCKET}/repo/objects" 2>/dev/null | wc -l || true)"
          echo "local store holds ${objects} objects; bucket holds ${remote_objects}"
          if [ "$remote_objects" -gt 0 ] && [ "$objects" -lt $((remote_objects / 2)) ]; then
            echo "::error::local store has ${objects} objects against ${remote_objects} published; refusing to sync" >&2
            exit 1
          fi

          # Transport only. Every filter lives with the phase that needs it:
          # rclone warns that mixing --include and --exclude leaves the parse
          # order indeterminate, so which files a phase touches becomes a
          # guess. --filter rules are first-match in the order given.
          common=(--transfers=32 --checkers=32 --fast-list --retries=3
                  --stats-one-line)

          # Objects are content-addressed and never rewritten, so they can be
          # cached forever. A cache hit at the edge never becomes a billed
          # Class B operation, which is what makes a CDN in front of the
          # bucket worth having.
          immutable=(--header-upload "Cache-Control: public, max-age=31536000, immutable")
          # summary and refs are the pointers that change every release.
          mutable=(--header-upload "Cache-Control: public, max-age=60")

          # Objects are content-addressed: the name is a hash of the content,
          # so a matching name means matching bytes and there is nothing to
          # compare beyond existence. --size-only says exactly that. Without
          # it rclone compares modification times, and against S3 with
          # --fast-list it reads those from the bucket listing rather than
          # from the mtime it stores as metadata, decides every object
          # differs, and re-uploads the entire store every run.
          content=(--size-only
                   --filter "- /tmp/**" --filter "- /state/**"
                   --filter "- /summary*" --filter "- /refs/**"
                   --filter "- /config"
                   --filter "+ **")
          # Everything the content phase deliberately skips.
          pointers=(--filter "+ /summary*" --filter "+ /refs/**"
                    --filter "+ /config" --filter "- **")

          # Order matters, and it is the whole reason this is three commands
          # rather than one sync. A client that reads a new summary naming
          # objects that have not been uploaded yet gets a broken pull, so
          # content goes up first, the pointers that make it reachable second,
          # and only then is anything deleted.
          echo "::group::content"
          rclone copy site/repo "r2:${BUCKET}/repo" "${common[@]}" "${immutable[@]}" \
            "${content[@]}"
          echo "::endgroup::"

          # No --size-only here. These few files change content every release
          # and can land on the same size, so --ignore-times uploads them
          # whether or not rclone thinks they differ. Six small files;
          # correctness is worth more than the skip.
          echo "::group::pointers"
          rclone copy site/repo "r2:${BUCKET}/repo" "${common[@]}" "${mutable[@]}" \
            --ignore-times "${pointers[@]}"
          echo "::endgroup::"

          # Deletion pass. It carries the same header and the same filters as
          # the content phase for one reason: sync uploads as well as deletes,
          # and an upload here without --header-upload silently strips the
          # Cache-Control off whatever it touches. That is how objects ended
          # up in the bucket with no cache header at all. Excluding the
          # pointers leaves them exactly as the phase above wrote them; they
          # are fixed names and never orphaned.
          echo "::group::prune"
          rclone sync site/repo "r2:${BUCKET}/repo" "${common[@]}" "${immutable[@]}" \
            "${content[@]}" --delete-after
          echo "::endgroup::"

          # Descriptors last, and published-version last of all: a scheduled
          # run reads it to decide whether this version is already out.
          rclone copy site "r2:${BUCKET}" "${common[@]}" "${mutable[@]}" \
            --filter "+ /openlogi.gpg" --filter "+ /openlogi.flatpakrepo" \
            --filter "+ /*.flatpakref" --filter "+ /index.html" \
            --filter "- **"
          rclone copy site "r2:${BUCKET}" "${common[@]}" "${mutable[@]}" \
            --filter "+ /published-version" --filter "- **"

          echo "published to ${R2_PUBLIC_BASE:-the bucket}"

      - name: Verify the published repository
        if: steps.gate.outputs.configured == 'true'
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE%/}"
          # Reading the store back over its public URL is the only check that
          # covers the upload itself: every step above can pass while the
          # bucket serves something a client cannot use.
          mkdir -p verify && ostree --repo=verify init --mode=archive-z2
          ostree --repo=verify remote add --no-gpg-verify published "${base}/repo/"
          refs="$(ostree --repo=verify remote refs published)"
          echo "$refs"
          echo "$refs" | grep -q "^published:app/${FLATPAK_ID}/x86_64/stable$"
          echo "$refs" | grep -q "^published:app/${FLATPAK_ID}/aarch64/stable$"
          got="$(curl -fsSL "${base}/published-version")"
          [ "$got" = "$VERSION" ] || { echo "::error::published-version is ${got}, expected ${VERSION}" >&2; exit 1; }
          echo "verified ${VERSION} at ${base}"
