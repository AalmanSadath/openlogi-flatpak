# Build OpenLogi from an upstream release tarball and publish both
# architectures as a signed OSTree repository on GitHub Pages.
#
# Upstream ships .deb/.rpm/.pkg.tar.zst with no repository behind them, and its
# in-app updater publishes no Linux artifact, so nothing on Linux can upgrade
# itself. This is that missing half, and it needs nothing from upstream: it
# consumes released tarballs, unmodified.
#
# Publishing is gated on FLATPAK_GPG_PRIVATE_KEY. Without it the build still
# runs and uploads artifacts, so a fork of this repo is inert rather than red.
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (blank = latest release)"
        type: string
        default: ""
  # Upstream releases are not events this repository can see, so poll. Daily is
  # far more often than OpenLogi releases, and a run where the published version
  # already matches upstream exits before building anything.
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLATPAK_ID: org.openlogi.OpenLogi
  UPSTREAM: AprilNEA/OpenLogi
  RUNTIME_VERSION: "25.08"

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      sha256: ${{ steps.pick.outputs.sha256 }}
      changed: ${{ steps.pick.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Pick the tag and hash its tarball
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            version="${REQUESTED}"
          else
            version="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          fi
          echo "upstream release: ${version}"

          url="https://github.com/${UPSTREAM}/archive/refs/tags/${version}.tar.gz"
          curl -fsSL "$url" -o src.tar.gz
          sha256="$(sha256sum src.tar.gz | cut -d' ' -f1)"

          # Skip a scheduled run that would rebuild what is already published.
          # A manual dispatch always proceeds, so a failed publish can be redone.
          published=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            published="$(curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/published-version" 2>/dev/null || true)"
          fi
          if [ "$published" = "$version" ]; then
            echo "already published ${version}, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install --user -y --noninteractive flathub \
            "org.freedesktop.Platform//${RUNTIME_VERSION}" \
            "org.freedesktop.Sdk//${RUNTIME_VERSION}" \
            "org.freedesktop.Sdk.Extension.llvm20//${RUNTIME_VERSION}"

      - name: Point the manifest at this release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" "$SHA256" <<'PY'
          import re, sys, datetime
          version, sha256 = sys.argv[1], sys.argv[2]
          bare = version.lstrip("v")

          path = "org.openlogi.OpenLogi.yml"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(archive/refs/tags/)v[^.]*[^/]*\.tar\.gz", rf"\g<1>{version}.tar.gz", text, count=1)
          text = re.sub(r"(sha256:\s*)[0-9a-f]{64}", rf"\g<1>{sha256}", text, count=1)
          open(path, "w", encoding="utf-8").write(text)

          # AppStream drives what software centres call the latest version, so a
          # stale <release> advertises the wrong one whatever the build contains.
          path = "org.openlogi.OpenLogi.metainfo.xml"
          text = open(path, encoding="utf-8").read()
          today = datetime.date.today().isoformat()
          text = re.sub(
              r'<release version="[^"]*" date="[^"]*"/>',
              f'<release version="{bare}" date="{today}"/>',
              text,
              count=1,
          )
          open(path, "w", encoding="utf-8").write(text)
          print(f"building {version} ({sha256[:12]}…)")
          PY
          grep -E "archive/refs/tags|sha256:" org.openlogi.OpenLogi.yml

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo --default-branch=stable \
            build "${FLATPAK_ID}.yml"
          flatpak build-update-repo repo
          ostree --repo=repo refs
          du -sh repo

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo
          retention-days: 7
          compression-level: 0 # OSTree objects are already compressed

  publish:
    name: Publish to GitHub Pages
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for the signing key
        id: gpg
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "FLATPAK_GPG_PRIVATE_KEY is not configured, skipping publish." >&2
            echo "An unsigned repository would force every user to add the" >&2
            echo "remote with --no-gpg-verify, so this stops instead." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flatpak
        if: steps.gpg.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - uses: actions/download-artifact@v8
        if: steps.gpg.outputs.configured == 'true'
        with:
          pattern: flatpak-repo-*
          path: arch-repos

      - name: Import the signing key
        if: steps.gpg.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s' "$KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --list-secret-keys --with-colons \
            | awk -F: '/^fpr:/ {print "GPG_FINGERPRINT=" $10; exit}' >> "$GITHUB_ENV"

      - name: Merge both architectures into one signed repository
        if: steps.gpg.outputs.configured == 'true'
        run: |
          # Fail loudly. A failure inside `$( )` in a for-list does not trip
          # `set -e`, which is how an empty store once published green: the ref
          # loop silently iterated nothing. nullglob turns a non-matching glob
          # into no iterations rather than one iteration over the literal.
          set -euo pipefail
          shopt -s nullglob

          # actions/upload-artifact does not carry empty directories, and a
          # freshly built OSTree repo has several: refs/mirrors, refs/remotes,
          # state, tmp/cache, extensions. `ostree refs` opendir()s
          # refs/remotes and fails without it, so a repo that survived the
          # artifact round-trip is not usable until they are put back. The old
          # `pull --mirror` never noticed because it reads the source repo's
          # summary over a file:// remote rather than listing its refs.
          for repo in arch-repos/flatpak-repo-*; do
            mkdir -p "$repo"/refs/heads "$repo"/refs/mirrors \
              "$repo"/refs/remotes "$repo"/state "$repo"/tmp/cache \
              "$repo"/extensions
          done

          echo "::group::artifacts as downloaded"
          ls -la arch-repos || echo "arch-repos missing"
          for repo in arch-repos/*; do
            echo "--- $repo"
            ostree --repo="$repo" refs || echo "  not an ostree repo"
          done
          echo "::endgroup::"

          # Seeded from what is already published, then bounded by
          # --prune-depth below. A release is ~64 MB across both arches, so a
          # six-deep store sits near 390 MB against the 1 GB Pages cap, and
          # keeping parents buys two things a from-scratch rebuild cannot:
          # clients can roll back to a previous commit, and static deltas have
          # something to delta against instead of every update being a full
          # download.
          # ostree init does not create parents.
          mkdir -p site/repo
          ostree --repo=site/repo init --mode=archive-z2

          published_repo="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/repo/"
          if curl -fsSL -o /dev/null "${published_repo}config"; then
            echo "seeding from ${published_repo}"
            # --no-gpg-verify: these commits were signed by this workflow on the
            # way out and are re-signed below; verifying here would need the
            # public key imported purely to read our own history back.
            ostree --repo=site/repo remote add --no-gpg-verify \
              --if-not-exists published "${published_repo}"
            # How many refs the remote advertises, before pulling anything.
            remote_refs="$(ostree --repo=site/repo remote refs published | wc -l)"
            echo "published repository advertises ${remote_refs} ref(s)"
            # No `|| echo` here. Swallowing this is what left the store with no
            # parent to commit onto, so every build landed parentless and the
            # history this exists to keep never formed.
            #
            # --depth is not optional here. It defaults to 0, meaning "traverse
            # no parents": the seed takes each ref's head commit and nothing
            # behind it, so the store rebuilt every run held the previous
            # release plus the new one and never more, whatever --prune-depth
            # said. The site is republished wholesale, so every commit that is
            # meant to stay reachable has to be pulled back down first. Kept in
            # step with --prune-depth below: N parents plus the head is N+1
            # commits, and the new commit on top is pruned back to N+1 again.
            ostree --repo=site/repo pull --mirror --depth=5 published
            seeded="$(ostree --repo=site/repo refs | wc -l)"
            echo "seeded ${seeded} ref(s)"
            # Ref count alone cannot see the failure this guard was written
            # for: six refs seeded one commit deep looks identical to six
            # seeded nine deep, and the shallow one silently caps retention.
            seeded_refs="$(ostree --repo=site/repo refs)"
            while read -r ref; do
              [ -n "$ref" ] || continue
              echo "  seeded ${ref} at $(ostree --repo=site/repo log "$ref" | grep -c '^commit ') commit(s)"
            done <<< "$seeded_refs"
            if [ "$remote_refs" -gt 0 ] && [ "$seeded" -eq 0 ]; then
              echo "::error::the published repository advertises ${remote_refs} refs but none were seeded" >&2
              exit 1
            fi
          else
            echo "no published repository yet; starting a fresh store"
          fi
          # `ostree pull --mirror` would overwrite each ref with the build
          # job's commit, which has no parent — the seeded history would become
          # unreachable and be pruned, leaving --prune-depth nothing to keep.
          # build-commit-from instead lands the same content as a new commit on
          # top of whatever the ref already points at, which is what makes the
          # chain (and therefore rollback and deltas) exist at all.
          #
          # It also signs the commits it creates. flatpak-builder makes them in
          # the build jobs, which have no access to the key, and
          # `build-update-repo --gpg-sign` signs only the summary, while a
          # client verifies the commit it pulls. Without a signature here every
          # install fails with "GPG verification enabled, but no signatures
          # found".
          committed=0
          for repo in arch-repos/flatpak-repo-*; do
            refs="$(ostree --repo="$repo" refs)"
            if [ -z "$refs" ]; then
              echo "::error::$repo lists no refs" >&2
              exit 1
            fi
            while read -r ref; do
              [ -n "$ref" ] || continue
              echo "committing $ref from $(basename "$repo")"
              flatpak build-commit-from \
                --src-repo="$repo" --src-ref="$ref" \
                --gpg-sign="${GPG_FINGERPRINT}" --gpg-homedir="${GNUPGHOME}" \
                --no-update-summary \
                site/repo "$ref"
              committed=$((committed + 1))
              parent="$(ostree --repo=site/repo log "$ref" | grep -c '^commit ')"
              echo "  ${ref} now ${parent} commit(s) deep"
            done <<< "$refs"
          done
          if [ "$committed" -eq 0 ]; then
            echo "::error::no refs were committed; refusing to publish an empty repository" >&2
            exit 1
          fi
          echo "committed ${committed} ref(s)"

          # Deltas are worth generating now that a parent exists: an update
          # from the previous release ships the changed objects rather than a
          # full ~33 MB copy, which matters more for the 100 GB/month Pages
          # bandwidth allowance than the objects themselves do for the 1 GB
          # size cap. --prune-depth=5 keeps the current commit plus five, so a
          # release that breaks something has several places to roll back to.
          # Depth buys rollback range rather than delta coverage: deltas are
          # generated between consecutive commits, so a client skipping
          # releases still falls back to a full download however deep the
          # store is.
          flatpak build-update-repo \
            --gpg-sign="${GPG_FINGERPRINT}" \
            --generate-static-deltas \
            --prune --prune-depth=5 \
            site/repo
          # A summary without the app refs is the failure that shipped before:
          # every step green, every client seeing an empty remote. Refuse to
          # hand that to deploy-pages, which would overwrite a working site.
          published_refs="$(ostree --repo=site/repo refs | grep -c "^app/" || true)"
          if [ "$published_refs" -eq 0 ]; then
            echo "::error::site/repo has no app refs after update; refusing to deploy" >&2
            exit 1
          fi
          echo "app refs in the store: ${published_refs}"

          ostree --repo=site/repo refs
          # History depth per ref, so a run makes it obvious whether parents
          # are accumulating or every build is still landing parentless.
          for ref in $(ostree --repo=site/repo refs); do
            depth="$(ostree --repo=site/repo log "$ref" | grep -c '^commit ')"
            echo "${ref}: ${depth} commit(s) retained"
          done
          du -sh site/repo
          du -sh site/repo/deltas 2>/dev/null || echo "no deltas generated"

          # GitHub Pages is documented as a 1 GB soft cap. Retention is bounded
          # by --prune-depth, but per-release growth is not: a heavier build,
          # or a third architecture, moves it. Report the headroom every run so
          # the depth is a measured choice rather than a standing assumption.
          # Deliberately a warning, not a failure — refusing to publish would
          # trade a working repository for a tidy one.
          size_mb="$(du -sm site/repo | cut -f1)"
          echo "store: ${size_mb} MB of a 1024 MB soft cap"
          if [ "$size_mb" -gt 700 ]; then
            echo "::warning::the published store is ${size_mb} MB; consider lowering --prune-depth" >&2
          fi

      - uses: actions/configure-pages@v5
        if: steps.gpg.outputs.configured == 'true'
        id: pages_base

      - name: Write the remote descriptors
        if: steps.gpg.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          base="${{ steps.pages_base.outputs.base_url }}"
          base="${base:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          gpg --export "${GPG_FINGERPRINT}" > site/openlogi.gpg
          key_b64="$(base64 -w0 < site/openlogi.gpg)"

          # Read back by scheduled runs to skip rebuilding what is already out.
          printf '%s' "${VERSION}" > site/published-version

          cat > site/openlogi.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=OpenLogi
          Url=${base}/repo/
          Homepage=https://github.com/${UPSTREAM}
          Comment=Logitech HID++ device control
          Description=Remap buttons, DPI, and SmartShift on Logitech devices.
          GPGKey=${key_b64}
          EOF

          cat > "site/${FLATPAK_ID}.flatpakref" <<EOF
          [Flatpak Ref]
          Title=OpenLogi
          Name=${FLATPAK_ID}
          Branch=stable
          Url=${base}/repo/
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=${key_b64}
          EOF

          sed -e "s|@BASE@|${base}|g" -e "s|@VERSION@|${VERSION}|g" \
            index.html.in > site/index.html

      - uses: actions/upload-pages-artifact@v4
        if: steps.gpg.outputs.configured == 'true'
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: steps.gpg.outputs.configured == 'true'
        id: deploy
