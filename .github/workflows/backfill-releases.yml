# Cut GitHub releases for versions that are already in the published
# repository.
#
# Releases were added to publish.yml after several versions had already been
# built and published, and rebuilding all of them only to produce a file that
# already exists in the repository would be wasteful and would put a pointless
# extra commit on every ref. The bundles here come out of the published history
# instead: pull it, find the commit that carries each version, point a local ref
# at it, and bundle that. Nothing is compiled.
#
# One-shot by nature. Once the backlog has releases, publish.yml handles every
# new one and this workflow has nothing left to do.
#
# It needs no secrets. The public key it embeds in the bundles is served
# alongside the repository, and the history it reads is public.
name: Backfill releases

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Tags to release, space separated (blank = every version in the published history)"
        type: string
        default: ""
      skip_existing:
        description: "Leave versions that already have a release alone"
        type: boolean
        default: true

concurrency:
  group: releases
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLATPAK_ID: org.openlogi.OpenLogi
  UPSTREAM: AprilNEA/OpenLogi

jobs:
  backfill:
    name: Backfill
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check the bucket is configured
        id: gate
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          if [ -z "${R2_PUBLIC_BASE}" ]; then
            echo "::error::R2_PUBLIC_BASE is not set; there is no published repository to read" >&2
            exit 1
          fi

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree

      - name: Pull the published history
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE%/}"

          # The same key clients verify with, served next to the repository it
          # signs. Pulling with it verifies every commit read here, so a
          # tampered store cannot become a signed-looking release asset.
          curl -fsSL "${base}/openlogi.gpg" -o openlogi.gpg
          ostree --repo=repo init --mode=archive
          ostree --repo=repo remote add published "${base}/repo/" \
            --gpg-import=openlogi.gpg

          # --depth=-1: the whole retained chain, not just the head. This is
          # the one place that wants every commit, since each one is a version
          # that may still be missing a release. Bytes are free on R2 and the
          # retained store is a few hundred MB.
          ostree --repo=repo pull --depth=-1 published \
            "app/${FLATPAK_ID}/x86_64/stable" "app/${FLATPAK_ID}/aarch64/stable"
          du -sh repo

      - name: Map each commit to the version it carries
        id: map
        run: |
          set -euo pipefail
          # The version is not in the commit metadata, but the build wrote it
          # into the AppStream file inside the commit, which is the same value
          # software centres show. Reading it back from the tree is therefore
          # the version this commit *is*, not a guess from its position in the
          # log.
          : > versions.tsv
          for arch in x86_64 aarch64; do
            ref="published:app/${FLATPAK_ID}/${arch}/stable"
            echo "::group::${arch}"
            for commit in $(ostree --repo=repo log "$ref" | awk '/^commit /{print $2}'); do
              bare="$(ostree --repo=repo cat "$commit" \
                "/files/share/metainfo/${FLATPAK_ID}.metainfo.xml" 2>/dev/null \
                | sed -n 's/.*<release version="\([^"]*\)".*/\1/p' | head -1)"
              if [ -z "$bare" ]; then
                echo "  ${commit:0:12} carries no version, skipping" >&2
                continue
              fi
              echo "  ${commit:0:12}  v${bare}"
              # Newest first, so the first sighting of a version wins. A
              # version can appear twice: a rebuild of the same upstream tag
              # lands as a second commit, and the later one is the one the
              # repository has been serving.
              printf '%s\t%s\t%s\n' "v${bare}" "$arch" "$commit" >> versions.tsv
            done
            echo "::endgroup::"
          done

          # Every version seen, newest release first, deduplicated.
          awk -F'\t' '!seen[$1]++ {print $1}' versions.tsv > all-versions.txt
          echo "versions in the published history:"
          sed 's/^/  /' all-versions.txt

      - name: Build a bundle per version and architecture
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          REQUESTED: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE%/}"

          if [ -n "${REQUESTED}" ]; then
            # Validate rather than trust: a typo would otherwise produce an
            # empty release, which is worse than a failed run.
            wanted=""
            for v in ${REQUESTED}; do
              if grep -qx -- "$v" all-versions.txt; then
                wanted="${wanted} ${v}"
              else
                echo "::error::${v} is not in the published history" >&2
                exit 1
              fi
            done
          else
            wanted="$(tr '\n' ' ' < all-versions.txt)"
          fi
          echo "building bundles for:${wanted}"

          for version in ${wanted}; do
            mkdir -p "out/${version}"
            for arch in x86_64 aarch64; do
              commit="$(awk -F'\t' -v v="$version" -v a="$arch" \
                '$1==v && $2==a {print $3; exit}' versions.tsv)"
              if [ -z "$commit" ]; then
                echo "::warning::${version} has no ${arch} commit in the retained history" >&2
                continue
              fi
              # The pull left these as remote refs, and build-bundle resolves
              # the local name. Creating one at the commit we want is what
              # makes bundling a *historical* version possible at all --
              # without it every bundle would silently be the head.
              ostree --repo=repo refs --force \
                --create="app/${FLATPAK_ID}/${arch}/stable" "$commit"
              out="out/${version}/OpenLogi-${version}-${arch}.flatpak"
              # Extraction, not execution: both architectures are bundled here
              # on an x86_64 runner.
              flatpak build-bundle \
                --arch="$arch" \
                --repo-url="${base}/repo/" \
                --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
                --gpg-keys=openlogi.gpg \
                repo "$out" "${FLATPAK_ID}" stable
              echo "  ${out}  $(du -h "$out" | cut -f1)  from ${commit:0:12}"

              # Read the version back out of the finished bundle. Everything
              # above can look right while the ref resolved to the wrong
              # commit, and a release asset labelled 0.7.2 that contains 0.7.10
              # is the one failure here that nobody would notice.
              rm -rf check && ostree --repo=check init --mode=archive
              flatpak build-import-bundle check "$out" >/dev/null
              got="$(ostree --repo=check cat "app/${FLATPAK_ID}/${arch}/stable" \
                "/files/share/metainfo/${FLATPAK_ID}.metainfo.xml" \
                | sed -n 's/.*<release version="\([^"]*\)".*/v\1/p' | head -1)"
              if [ "$got" != "$version" ]; then
                echo "::error::${out} contains ${got}, expected ${version}" >&2
                exit 1
              fi
              echo "    verified: contains ${got}"
            done
            ( cd "out/${version}" && sha256sum ./*.flatpak > SHA256SUMS )
          done
          echo "${wanted}" > wanted.txt

      - name: Create the releases
        env:
          GH_TOKEN: ${{ github.token }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          SKIP_EXISTING: ${{ inputs.skip_existing }}
        run: |
          set -euo pipefail
          base="${R2_PUBLIC_BASE%/}"
          note="Cut from the published repository rather than rebuilt, so this is byte for byte the commit the repository has been serving for this version."

          wanted="$(cat wanted.txt)"
          for version in ${wanted}; do
            if gh release view "$version" >/dev/null 2>&1; then
              if [ "${SKIP_EXISTING}" = "true" ]; then
                echo "${version} already has a release, leaving it alone"
                continue
              fi
              echo "updating the existing ${version} release"
              .github/scripts/release-notes.sh "$version" "$base" "$note" > notes.md
              gh release edit "$version" --notes-file notes.md
              gh release upload "$version" "out/${version}"/* --clobber
            else
              echo "creating ${version}"
              .github/scripts/release-notes.sh "$version" "$base" "$note" > notes.md
              # --target: these tags are being created now, long after the
              # commits they describe, so they point at the current head. The
              # tag names upstream's release; it does not claim to name a state
              # of this repository.
              gh release create "$version" "out/${version}"/* \
                --target "${GITHUB_SHA}" \
                --title "OpenLogi ${version}" \
                --notes-file notes.md
            fi
            gh release view "$version" --json tagName,assets \
              --jq '.tagName + ": " + ([.assets[].name] | join(", "))'
          done
