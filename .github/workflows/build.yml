# Build OpenLogi from an upstream release tarball, for both architectures.
#
# Two callers, one build. `publish.yml` calls this to get the per-architecture
# OSTree repositories it merges, signs and uploads; a manual dispatch runs it on
# its own to get nothing but the two installable `.flatpak` bundles. Keeping the
# build in one place is the point: a second copy of it in the publish workflow
# would drift, and the drift would only show up as a release that differs from
# what the repository serves.
#
# Nothing here needs a secret. A fork can dispatch this and get working bundles.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (blank = latest release)"
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Upstream tag to build (blank = latest release)"
        type: string
        required: false
        default: ""
    outputs:
      version:
        description: "The upstream tag that was built"
        value: ${{ jobs.resolve.outputs.version }}
      sha256:
        description: "sha256 of the upstream source tarball"
        value: ${{ jobs.resolve.outputs.sha256 }}
      changed:
        description: "false when a scheduled run found this version already published"
        value: ${{ jobs.resolve.outputs.changed }}

permissions:
  contents: read

env:
  FLATPAK_ID: org.openlogi.OpenLogi
  UPSTREAM: AprilNEA/OpenLogi
  RUNTIME_VERSION: "25.08"

jobs:
  resolve:
    name: Resolve upstream release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      sha256: ${{ steps.pick.outputs.sha256 }}
      released: ${{ steps.pick.outputs.released }}
      changed: ${{ steps.pick.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Pick the tag and hash its tarball
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            version="${REQUESTED}"
          else
            version="$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)"
          fi
          echo "upstream release: ${version}"

          url="https://github.com/${UPSTREAM}/archive/refs/tags/${version}.tar.gz"
          curl -fsSL "$url" -o src.tar.gz
          sha256="$(sha256sum src.tar.gz | cut -d' ' -f1)"

          # When upstream published it, not when this ran. AppStream's release
          # date is what software centres show users as the date of the
          # release, so the build date is the wrong answer even though it looks
          # close enough on the day the release lands.
          released="$(gh api "repos/${UPSTREAM}/releases/tags/${version}" \
            --jq '.published_at' 2>/dev/null | cut -c1-10 || true)"
          if [ -z "$released" ]; then
            # A tag with no GitHub release behind it. Rare, and the tag's own
            # commit date is still a truthful answer.
            released="$(gh api "repos/${UPSTREAM}/commits/${version}" \
              --jq '.commit.committer.date' | cut -c1-10)"
          fi
          echo "published upstream on ${released}"

          # Skip a scheduled run that would rebuild what is already published.
          # A manual dispatch always proceeds, so a failed publish can be redone.
          # `github.event_name` here is the caller's event, so a scheduled
          # publish still reaches this branch through the workflow_call.
          published=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "${R2_PUBLIC_BASE}" ]; then
            published="$(curl -fsSL "${R2_PUBLIC_BASE%/}/published-version" 2>/dev/null || true)"
          fi
          if [ "$published" = "$version" ]; then
            echo "already published ${version}, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=${version}"
            echo "sha256=${sha256}"
            echo "released=${released}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install --user -y --noninteractive flathub \
            "org.freedesktop.Platform//${RUNTIME_VERSION}" \
            "org.freedesktop.Sdk//${RUNTIME_VERSION}" \
            "org.freedesktop.Sdk.Extension.llvm20//${RUNTIME_VERSION}"

      - name: Point the manifest at this release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA256: ${{ needs.resolve.outputs.sha256 }}
          RELEASED: ${{ needs.resolve.outputs.released }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" "$SHA256" "$RELEASED" <<'PY'
          import re, sys
          version, sha256, released = sys.argv[1], sys.argv[2], sys.argv[3]
          bare = version.lstrip("v")

          path = "org.openlogi.OpenLogi.yml"
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"(archive/refs/tags/)v[^.]*[^/]*\.tar\.gz", rf"\g<1>{version}.tar.gz", text, count=1)
          text = re.sub(r"(sha256:\s*)[0-9a-f]{64}", rf"\g<1>{sha256}", text, count=1)
          open(path, "w", encoding="utf-8").write(text)

          # AppStream drives what software centres call the latest version, so a
          # stale <release> advertises the wrong one whatever the build contains.
          path = "org.openlogi.OpenLogi.metainfo.xml"
          text = open(path, encoding="utf-8").read()
          text = re.sub(
              r'<release version="[^"]*" date="[^"]*"/>',
              f'<release version="{bare}" date="{released}"/>',
              text,
              count=1,
          )
          open(path, "w", encoding="utf-8").write(text)
          print(f"building {version} ({sha256[:12]}…)")
          PY
          grep -E "archive/refs/tags|sha256:" org.openlogi.OpenLogi.yml

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo --default-branch=stable \
            build "${FLATPAK_ID}.yml"
          flatpak build-update-repo repo
          ostree --repo=repo refs
          du -sh repo

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo
          retention-days: 7
          compression-level: 0 # OSTree objects are already compressed

      # A single-file install for anyone who wants one build rather than a
      # remote. Unsigned, and with no origin baked in: the signing key lives in
      # the publish job, so a bundle that claimed an origin here would create a
      # remote whose updates could never be verified. `publish.yml` builds its
      # own signed, origin-carrying bundles for the release; this one is the
      # artifact a fork or a one-off dispatch gets.
      - name: Bundle
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out="OpenLogi-${VERSION}-${ARCH}.flatpak"
          flatpak build-bundle \
            --arch="${ARCH}" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$out" "${FLATPAK_ID}" stable
          ls -lh "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle-${{ matrix.arch }}
          path: OpenLogi-*.flatpak
          retention-days: 7
          compression-level: 0 # already a compressed OSTree stream
